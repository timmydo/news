[package]
name = "news"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
toml = "0.8"
html2text = "0.16"
quick-xml = "0.37"
redb = "2"
chrono = { version = "0.4", default-features = true, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
